name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (CPU-only torch)
        run: uv pip install --system -e ".[dev]"
      - name: Lint
        run: ruff check src tests app && ruff format --check src tests app
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest
